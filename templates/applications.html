<!DOCTYPE html>
<html>
<head>
    <title>Applications</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1, h2 {
            color: #333;
        }

        form div {
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button, .button {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
        }

        button:hover, .button:hover {
            background-color: #0056b3;
        }

        .app-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Add New Application</h1>
    <form method="POST">
        <div>
            <label>Company:</label><br>
            <input type="text" name="company" required>
        </div>
        <div>
            <label>Role:</label><br>
            <input type="text" name="role" required>
        </div>
        <div>
            <label>Status:</label><br>
            <select name="status" required>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
            </select>
        </div>
        <div>
            <label>Applied Date:</label><br>
            <input type="date" name="applied_date" required>
        </div>
        <div>
            <label>Follow Up Date:</label><br>
            <input type="date" name="follow_up_date">
        </div>
        <div>
            <label>Notes:</label><br>
            <textarea name="notes" rows="4"></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>

    <h2>All Applications</h2>
    {% for app in applications %}
        <div class="app-entry">
            <div>
                {{ app.company }} - {{ app.role }} ({{ app.status }}) on {{ app.applied_date.strftime('%Y-%m-%d') }}
            </div>
            <div class="button-group">
                <a href="/applications/edit/{{ app.id }}" class="button">Edit</a>
                <form method="POST" action="/applications/delete/{{ app.id }}">
                    <button type="submit" class="button">Delete</button>
                </form>
            </div>
        </div>
    {% endfor %}

    <a href="/" class="back-link">← Back to Home</a>
</body>
</html>
