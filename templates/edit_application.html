<!DOCTYPE html>
<html>
<head>
    <title>Edit Application</title>
</head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<body>
    <h1>Edit Application</h1>
    <form method="POST" style="max-width: 500px;">
        <div style="margin-bottom: 10px;">
            <label>Company:</label><br>
            <input type="text" name="company" value="{{ app.company }}" required style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Role:</label><br>
            <input type="text" name="role" value="{{ app.role }}" required style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Status:</label><br>
            <select name="status" required style="width: 100%;">
                <option value="Applied" {% if app.status == 'Applied' %}selected{% endif %}>Applied</option>
                <option value="Interview" {% if app.status == 'Interview' %}selected{% endif %}>Interview</option>
                <option value="Offer" {% if app.status == 'Offer' %}selected{% endif %}>Offer</option>
                <option value="Rejected" {% if app.status == 'Rejected' %}selected{% endif %}>Rejected</option>
            </select>
        </div>
        <div style="margin-bottom: 10px;">
            <label>Applied Date:</label><br>
            <input type="date" name="applied_date" value="{{ app.applied_date }}" required style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Follow Up Date:</label><br>
            <input type="date" name="follow_up_date" value="{{ app.follow_up_date }}" style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Notes:</label><br>
            <textarea name="notes" rows="4" style="width: 100%;">{{ app.notes }}</textarea>
        </div>
        <button type="submit" style="padding: 10px 20px;">Update</button>
    </form>
</body>
</html>
